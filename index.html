ar:'إضافة للأكتاف في يوم أرجل، وهي مقصودة. الدالية الجانبية تستشفي أسرع من معظم العضلات وتستجيب للتكرار، فثلاث مجموعات خفيفة هنا لا تكلفك شيئاً وتتراكم بسرعة عبر الدورة.'},
alt:{en:'Machine lateral raise',ar:'جهاز الرفرفة الجانبية'},q:'cable lateral raise side delt form'},
ohTri:{n:{en:'Overhead rope triceps extension',ar:'تمديد ترايسبس بالحبل خلف الرأس'},sets:4,reps:'10–12',rest:90,tier:1,anim:'overheadTri',
cue:{en:'Face away from the stack with the rope behind your head, elbows narrow and pointed forward. The long head of the triceps only grows from this stretched overhead position — a pushdown alone will never reach it.',
ar:'أدر ظهرك للجهاز والحبل خلف رأسك، والمرفقان قريبان ومتجهان للأمام. الرأس الطويلة للترايسبس لا تنمو إلا من هذه الوضعية الممدودة فوق الرأس — الدفع لأسفل وحده لن يصل إليها أبداً.'},
alt:{en:'Incline dumbbell overhead extension',ar:'تمديد دمبل خلف الرأس على بنش مائل'},q:'overhead rope tricep extension long head form'},
pushdown:{n:{en:'Rope triceps pushdown',ar:'دفع ترايسبس بالحبل'},sets:3,reps:'12–15',rest:75,tier:1,anim:'pushdown',
cue:{en:'Elbows pinned at your sides, push down and spread the rope apart at the bottom. Take the last set to failure.',
ar:'المرفقان مثبتان بجانبك، ادفع لأسفل وافتح الحبل في النهاية. خذ آخر مجموعة حتى الفشل.'},
alt:{en:'Machine triceps extension',ar:'جهاز تمديد الترايسبس'},q:'rope tricep pushdown proper form'},
pulldown:{n:{en:'Lat pulldown, shoulder-width grip',ar:'سحب أمامي بقبضة بعرض الكتفين'},sets:4,reps:'8–10',rest:120,tier:1,anim:'pulldown',
cue:{en:'Hands about shoulder-width, palms forward. Very wide grips do not build wider lats — the research is clear and most people in the gym get this wrong. Lean back slightly, pull to your upper chest, and let the arms stretch all the way up between reps.',
ar:'اليدان بعرض الكتفين تقريباً والكفان للأمام. القبضات الواسعة جداً لا تبني ظهراً أعرض — الأبحاث واضحة ومعظم الناس في الصالة يخطئون في هذا. مِل للخلف قليلاً واسحب لأعلى صدرك، ودع الذراعين تتمددان بالكامل بين التكرارات.'},
alt:{en:'Assisted pull-up machine',ar:'جهاز العقلة بمساعدة'},q:'lat pulldown grip width medium grip lat activation form'},
neutralPulldown:{n:{en:'Neutral-grip pulldown',ar:'سحب أمامي بقبضة محايدة'},sets:3,reps:'10–12',rest:120,tier:1,anim:'pulldown',
cue:{en:'Palms facing each other. This is the kindest vertical pull for the shoulder joint and it still loads the lats hard. Full stretch overhead on every rep.',
ar:'الكفان متقابلان. هذا أرحم سحب عمودي على مفصل الكتف ومع ذلك يحمّل الظهر بقوة. تمدد كامل فوق الرأس في كل تكرار.'},
alt:{en:'Assisted chin-up machine',ar:'جهاز العقلة بمساعدة'},q:'neutral grip lat pulldown proper form'},
chestRow:{n:{en:'Chest-supported machine row',ar:'تجديف جهاز بدعم الصدر'},sets:4,reps:'10–12',rest:120,tier:1,anim:'row',
cue:{en:'Chest flat against the pad. The pad removes every bit of cheating and your lower back does nothing at all, which matters a lot when you are training five or six times a week. Pull to the lower ribs and squeeze for one second.',
ar:'الصدر ملتصق بالوسادة. الوسادة تمنع أي غش وأسفل ظهرك لا يعمل إطلاقاً، وهذا مهم جداً عند التدريب خمس أو ست مرات أسبوعياً. اسحب لأسفل الأضلاع واعصر ثانية واحدة.'},
alt:{en:'Seated cable row',ar:'تجديف كيبل جالساً'},q:'chest supported machine row proper form'},
seatedRow:{n:{en:'Seated cable row, neutral grip',ar:'تجديف كيبل جالساً بقبضة محايدة'},sets:4,reps:'10–12',rest:120,tier:1,anim:'seatedRow',
cue:{en:'Sit tall and do not rock backwards to move the weight. Pull the handle to your belly button with the elbows brushing your sides, squeeze one second, then let the arms stretch all the way forward again.',
ar:'اجلس مستقيماً ولا تتمايل للخلف لتحريك الوزن. اسحب المقبض إلى سرتك والمرفقان يلامسان جانبيك، اعصر ثانية، ثم دع الذراعين تتمددان للأمام بالكامل مرة أخرى.'},
alt:{en:'Chest-supported machine row',ar:'تجديف جهاز بدعم الصدر'},q:'seated cable row neutral grip proper form'},
pullover:{n:{en:'Single-arm cable pullover',ar:'بولوفر كيبل بذراع واحدة'},sets:3,reps:'12–15',rest:75,tier:1,anim:'pullover',
cue:{en:'Cable set high, half-kneeling, arm almost straight with a small fixed bend at the elbow. Pull the handle down past your hip in a wide arc. One arm at a time gives you a longer range and a far harder stretch than the two-arm version.',
ar:'الكيبل عالياً، نصف ركوع، والذراع شبه مستقيمة بانحناء بسيط ثابت في المرفق. اسحب المقبض بقوس واسع حتى يتجاوز الورك. ذراع واحدة تعطيك مدى أطول وتمدداً أقوى بكثير من نسخة الذراعين.'},
alt:{en:'Two-arm rope pullover',ar:'بولوفر بالحبل بالذراعين'},q:'single arm cable lat pullover kneeling form'},
rearPec:{n:{en:'Reverse pec deck',ar:'رفرفة خلفية على الجهاز'},sets:3,reps:'15–20',rest:60,tier:2,anim:'rearDelt',
cue:{en:'Rear delts and posture. Arms almost straight, open wide, squeeze the shoulder blades together. Light weight always — this is never a strength exercise.',
ar:'الدالية الخلفية ووضعية الجسم. الذراعان شبه مستقيمتين، افتح عريضاً، واعصر لوحي الكتف معاً. وزن خفيف دائماً — هذا ليس تمرين قوة أبداً.'},
alt:{en:'Face pull on the rope',ar:'فيس بُل بالحبل'},q:'reverse pec deck rear delt proper form'},
rearCable:{n:{en:'Cable rear delt flye',ar:'رفرفة خلفية بالكيبل'},sets:3,reps:'15–20',rest:60,tier:2,anim:'rearDelt',
cue:{en:'Cables crossed at shoulder height, pull apart and back. Rear delts are the most undertrained muscle on most lifters and they are what finishes off the round, three-dimensional shoulder.',
ar:'الكيبلات متقاطعة بمستوى الكتف، افتح للخارج والخلف. الدالية الخلفية أكثر عضلة مهمَلة عند معظم المتدربين وهي التي تكمل شكل الكتف المستدير ثلاثي الأبعاد.'},
alt:{en:'Reverse pec deck',ar:'جهاز الرفرفة الخلفية'},q:'cable rear delt fly proper form'},
inclineCurl:{n:{en:'Incline dumbbell curl',ar:'بايسبس دمبل على بنش مائل'},sets:4,reps:'10–12',rest:90,tier:1,anim:'curl',
cue:{en:'Bench at 45 degrees with the arms hanging straight down behind your body. That hanging position is exactly what makes this better than a standing curl — it holds the biceps under load in its longest position.',
ar:'البنش على ٤٥ درجة والذراعان متدليتان مستقيمتين خلف جسمك. هذا التدلي هو بالضبط ما يجعله أفضل من البايسبس واقفاً — يُبقي البايسبس تحت الحمل في أطول وضعية له.'},
alt:{en:'Bayesian cable curl',ar:'بايسبس كيبل من الخلف'},q:'incline dumbbell curl proper form biceps stretch'},
cableCurl:{n:{en:'Cable curl',ar:'بايسبس كيبل'},sets:3,reps:'12–15',rest:75,tier:1,anim:'cableCurl',
cue:{en:'Cable rather than dumbbells, because the tension never drops off at the top the way it does with a free weight. Keep the elbows still at your sides and squeeze hard for a full second at the top of every rep.',
ar:'كيبل بدل الدمبل، لأن الشدّ لا يسقط أبداً في الأعلى كما يحدث مع الوزن الحر. أبقِ المرفقين ثابتين بجانبك واعصر بقوة ثانية كاملة في أعلى كل تكرار.'},
alt:{en:'EZ-bar curl',ar:'بايسبس بالبار المتعرج'},q:'cable curl proper form constant tension biceps'},
shrug:{n:{en:'Dumbbell shrug',ar:'هز أكتاف بالدمبل'},sets:3,reps:'12–15',rest:75,tier:2,anim:'shrug',
cue:{en:'Straight up, hold two seconds at the top, straight back down. No rolling — rolling the shoulders does nothing useful and only irritates the joint.',
ar:'لأعلى مباشرة، اثبت ثانيتين في الأعلى، ثم لأسفل مباشرة. بدون تدوير — تدوير الكتف لا يفيد بشيء ولا يسبب إلا إزعاج المفصل.'},
alt:{en:'Cable or machine shrug',ar:'هز أكتاف بالكيبل أو الجهاز'},q:'dumbbell shrug proper form traps'},
legPress:{n:{en:'Leg press',ar:'ضغط أرجل'},sets:4,reps:'10–12',rest:150,tier:2,anim:'legPress',
cue:{en:'Feet shoulder-width in the middle of the platform. Bring the knees as far toward your chest as you can without the lower back rounding off the pad, then press without slamming the knees straight.',
ar:'القدمان بعرض الكتفين في منتصف المنصة. قرّب الركبتين من صدرك بأقصى ما تستطيع بدون أن يتقوس أسفل ظهرك عن الوسادة، ثم ادفع بدون قفل الركبتين بعنف.'},
alt:{en:'Hack squat',ar:'هاك سكوات'},q:'leg press proper form depth foot placement'},
hackSquat:{n:{en:'Hack squat',ar:'هاك سكوات'},sets:3,reps:'10–12',rest:150,tier:2,anim:'hackSquat',
cue:{en:'The machine holds your torso for you, so you can go deeper under load than you safely could with a barbell. Descend until the thighs pass parallel, drive up without locking the knees hard.',
ar:'الجهاز يثبّت جذعك بدلاً عنك، فتستطيع النزول أعمق تحت الحمل مما يمكنك بأمان مع البار. انزل حتى يتجاوز الفخذ الموازاة، وادفع لأعلى بدون قفل الركبتين بقوة.'},
alt:{en:'Leg press, feet low on the platform',ar:'ضغط أرجل بقدمين منخفضتين'},q:'hack squat proper form depth quads'},
legExt:{n:{en:'Leg extension',ar:'تمديد أرجل'},sets:3,reps:'12–15',rest:75,tier:2,anim:'legExt',
cue:{en:'Pause one second at the top of every rep. Simple, safe, and it lets you finish the quads off without any of the whole-body fatigue a squat would cost you.',
ar:'اثبت ثانية في أعلى كل تكرار. بسيط وآمن ويتيح لك إنهاء الفخذ بدون أي إرهاق عام كالذي يكلفك إياه السكوات.'},
alt:{en:'Sissy squat',ar:'سيسي سكوات'},q:'leg extension proper form quads pause'},
seatedCurl:{n:{en:'Seated leg curl',ar:'ثني أرجل جالساً'},sets:3,reps:'10–12',rest:90,tier:2,anim:'legCurl',
cue:{en:'Seated beats lying here, and the research backs it: sitting flexes the hip, which holds the hamstrings in a longer stretch and produces measurably more growth. Lower over three slow seconds.',
ar:'الجالس أفضل من المستلقي هنا، والأبحاث تدعم ذلك: الجلوس يثني الورك فيُبقي الخلفية في تمدد أطول وينتج نمواً أكبر بشكل ملموس. انزل في ثلاث ثوانٍ بطيئة.'},
alt:{en:'Lying leg curl',ar:'ثني أرجل مستلقياً'},q:'seated leg curl vs lying hamstring stretch research'},
lyingCurl:{n:{en:'Lying leg curl',ar:'ثني أرجل مستلقياً'},sets:3,reps:'12–15',rest:75,tier:2,anim:'lyingCurl',
cue:{en:'Hips pressed flat into the pad — do not let them lift as you curl. Squeeze hard at the top and lower slowly.',
ar:'الوركان مضغوطان على الوسادة — لا تدعهما يرتفعان أثناء الثني. اعصر بقوة في الأعلى وانزل ببطء.'},
alt:{en:'Seated leg curl',ar:'ثني أرجل جالساً'},q:'lying leg curl proper form hamstrings'},
rdl:{n:{en:'Dumbbell Romanian deadlift',ar:'رفعة رومانية بالدمبل'},sets:4,reps:'10–12',rest:120,tier:2,anim:'rdl',
cue:{en:'Dumbbells rather than a barbell — much easier to learn and far kinder to the lower back. Push the hips backwards, keep the dumbbells grazing your legs, and stop the moment the hamstring stretch runs out, usually around mid-shin.',
ar:'دمبل بدل البار — أسهل بكثير في التعلم وأرحم لأسفل الظهر. ادفع الوركين للخلف، وأبقِ الدمبلز ملامسة لرجليك، وتوقف لحظة انتهاء تمدد الخلفية، عادة حول منتصف الساق.'},
alt:{en:'45° back extension holding a plate',ar:'تمديد ظهر ٤٥ درجة مع قرص'},q:'dumbbell romanian deadlift proper form hip hinge'},
calf:{n:{en:'Standing calf raise',ar:'رفع سمانة واقفاً'},sets:4,reps:'12–15',rest:60,tier:2,anim:'calf',
cue:{en:'Let the heel sink all the way down for a full stretch, then squeeze for two seconds at the top. Calves need range of motion far more than they need weight.',
ar:'دع الكعب ينزل بالكامل للحصول على تمدد كامل، ثم اعصر ثانيتين في الأعلى. السمانة تحتاج مدى الحركة أكثر بكثير مما تحتاج الوزن.'},
alt:{en:'Calf press on the leg press sled',ar:'ضغط سمانة على منصة ضغط الأرجل'},q:'standing calf raise proper form full range of motion'},
seatedCalfR:{n:{en:'Seated calf raise',ar:'رفع سمانة جالساً'},sets:4,reps:'15–20',rest:60,tier:2,anim:'seatedCalf',
cue:{en:'Seated bends the knee, which targets the soleus underneath the main calf muscle. Different muscle from the standing version, which is why both are in the rotation. Full stretch at the bottom.',
ar:'الجلوس يثني الركبة فيستهدف العضلة النعلية تحت السمانة الرئيسية. عضلة مختلفة عن نسخة الوقوف، ولهذا كلتاهما في الدورة. تمدد كامل في الأسفل.'},
alt:{en:'Calf press on the leg press',ar:'ضغط سمانة على جهاز الأرجل'},q:'seated calf raise soleus proper form'},
cableCrunch:{n:{en:'Cable crunch',ar:'كرنش كيبل'},sets:3,reps:'12–15',rest:60,tier:1,anim:'cableCrunch',
cue:{en:'Kneel facing the stack with the rope at your forehead. Curl the ribs down toward the hips and keep the hips completely still. Add weight every week rather than adding reps.',
ar:'اركع مواجهاً الجهاز والحبل عند جبهتك. لُف الأضلاع نحو الوركين وأبقِ الوركين ثابتين تماماً. زد الوزن كل أسبوع بدل زيادة التكرارات.'},
alt:{en:'Machine crunch',ar:'جهاز الكرنش'},q:'cable crunch proper form weighted abs'},
kneeRaise:{n:{en:'Hanging knee raise',ar:'رفع ركبتين معلقاً'},sets:3,reps:'12–15',rest:60,tier:1,anim:'kneeRaise',
cue:{en:'Hang from the bar, curl the knees up and roll the hips toward your ribs at the top. If the legs only swing, you are training hip flexors instead of abs.',
ar:'تعلّق بالبار، ارفع الركبتين ولُف الوركين نحو الأضلاع في الأعلى. إذا كانت الرجلان تتأرجحان فقط فأنت تدرب ثانيات الورك بدل البطن.'},
alt:{en:'Captain chair knee raise',ar:'الكرسي الروماني'},q:'hanging knee raise proper form abs pelvic tilt'},
declineSit:{n:{en:'Weighted decline sit-up',ar:'سِت أب منحدر بأوزان'},sets:3,reps:'12–15',rest:60,tier:1,anim:'declineSit',
cue:{en:'Hold a plate across your chest and roll up one vertebra at a time. Progress by adding plate weight, never by going past fifteen reps.',
ar:'أمسك قرصاً على صدرك وارتفع فقرة فقرة. التقدم بزيادة وزن القرص، لا بتجاوز خمسة عشر تكراراً أبداً.'},
alt:{en:'Machine crunch',ar:'جهاز الكرنش'},q:'weighted decline sit up proper form'},
abWheel:{n:{en:'Ab wheel rollout',ar:'عجلة البطن'},sets:3,reps:'8–12',rest:75,tier:1,anim:'abWheel',
cue:{en:'From the knees. Keep the ribs tucked down and never let the lower back sag. Extend a little further each week — that extra distance is the progression.',
ar:'من الركبتين. أبقِ القفص الصدري منخفضاً ولا تدع أسفل ظهرك يهبط أبداً. مُدّ أبعد قليلاً كل أسبوع — هذه المسافة الإضافية هي التقدم.'},
alt:{en:'Plank with a plate on your back',ar:'بلانك مع قرص على الظهر'},q:'ab wheel rollout proper form progression'},
singlePushdown:{n:{en:'Single-arm cable pushdown',ar:'دفع ترايسبس كيبل بذراع واحدة'},sets:3,reps:'12–15',rest:60,tier:1,anim:'pushdown',
cue:{en:'One arm at a time, so the weaker side cannot hide behind the stronger one. Elbow pinned at your side, push down and turn the little finger outward at the bottom. Take the last set to failure.',
ar:'ذراع واحدة في كل مرة، حتى لا تختبئ الجهة الأضعف خلف الأقوى. المرفق مثبت بجانبك، ادفع لأسفل ولُف الخنصر للخارج في النهاية. خذ آخر مجموعة حتى الفشل.'},
alt:{en:'Rope pushdown, both arms',ar:'دفع بالحبل بالذراعين'},q:'single arm cable tricep pushdown proper form'},
inclineOhExt:{n:{en:'Incline dumbbell overhead extension',ar:'تمديد ترايسبس دمبل على بنش مائل'},sets:4,reps:'10–12',rest:90,tier:1,anim:'inclineOhExt',
cue:{en:'Lie back on a 45-degree bench and let the dumbbells travel down behind your head. Lying on the incline puts the long head of the triceps under a deeper stretch than standing does, and it is far kinder to the elbows. Elbows stay pointed at the ceiling the whole time.',
ar:'استلقِ على بنش ٤٥ درجة ودع الدمبلز تنزل خلف رأسك. الاستلقاء على المائل يضع الرأس الطويلة للترايسبس تحت تمدد أعمق مما يفعله الوقوف، وهو أرحم بكثير للمرفقين. المرفقان يبقيان متجهين للسقف طوال الحركة.'},
alt:{en:'Overhead rope extension',ar:'تمديد بالحبل خلف الرأس'},q:'incline dumbbell overhead tricep extension long head'},
preacherCurl:{n:{en:'Preacher curl',ar:'بايسبس على بنش الواعظ'},sets:4,reps:'10–12',rest:90,tier:1,anim:'preacherCurl',
cue:{en:'The pad locks your upper arm down so the biceps gets no help at all from the shoulder. Lower the whole way until the arm is almost straight — that bottom position is exactly where most people cut the rep short and throw away the point of the exercise.',
ar:'الوسادة تثبّت عضدك فلا يحصل البايسبس على أي مساعدة من الكتف. انزل بالكامل حتى تكاد الذراع تستقيم — هذه النهاية السفلية هي بالضبط حيث يقصّر معظم الناس التكرار ويهدرون الهدف من التمرين.'},
alt:{en:'Machine preacher curl',ar:'جهاز بايسبس الواعظ'},q:'preacher curl proper form full range biceps'},
hammerCurl:{n:{en:'Hammer curl',ar:'هامر كيرل'},sets:3,reps:'12–15',rest:75,tier:1,anim:'hammerCurl',
cue:{en:'Palms facing each other the whole way up. This builds the brachialis, the muscle sitting underneath the biceps. Grow it and it pushes the biceps up from below, which is what actually makes an arm look thicker from the side.',
ar:'الكفان متقابلان طوال الحركة. هذا يبني العضلة العضدية، العضلة التي تقع تحت البايسبس. نمّها فتدفع البايسبس للأعلى من تحت، وهذا ما يجعل الذراع يبدو أسمك فعلاً من الجانب.'},
alt:{en:'Rope hammer curl on the cable',ar:'هامر بالحبل على الكيبل'},q:'hammer curl proper form brachialis'},
pallof:{n:{en:'Pallof press',ar:'بالوف برس'},sets:3,reps:'12 / side',rest:45,tier:2,anim:'pallof',
cue:{en:'Stand side-on to the cable at chest height, press the handle straight out and resist the twist. This builds the deep bracing that makes the waist look tighter.',
ar:'قف جانبياً للكيبل بمستوى الصدر، ادفع المقبض للأمام مستقيماً وقاوم الالتفاف. هذا يبني الشدّ العميق الذي يجعل الخصر يبدو أنحف.'},
alt:{en:'Suitcase carry, 40 m per side',ar:'حمل الحقيبة ٤٠ متراً لكل جهة'},q:'pallof press proper form anti rotation'},
chop:{n:{en:'Cable woodchopper',ar:'قطع خشب بالكيبل'},sets:3,reps:'12 / side',rest:45,tier:2,anim:'chop',
cue:{en:'Rotate from the torso with the hips fairly still. This builds the taper at the waist rather than thickening it.',
ar:'الدوران من الجذع والوركان شبه ثابتين. هذا يبني الانحدار عند الخصر بدل أن يُسمّكه.'},
alt:{en:'Landmine rotation',ar:'دوران اللاندماين'},q:'cable woodchopper proper form obliques'}
};

sub:{en:'Chest leads, then two triceps exercises to finish. Six exercises, about 55 minutes.',
ar:'الصدر أولاً، ثم تمرينا ترايسبس في النهاية. ستة تمارين، حوالي ٥٥ دقيقة.'},

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let viewIdx=0,curView='train';
const rot=()=>SESSIONS.slice(0,ROTLEN);
const S=i=>rot()[((i%ROTLEN)+ROTLEN)%ROTLEN];
const exList=s=>[...s.ex.map(k=>E[k]),...s.core.map(k=>E[k])];
const kSet=(sid,i,n)=>`${sid}|${i}|${n}`;
const kEx=(sid,x)=>sid+'|'+x.n.en;
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function stats(s){
let t=0,n=0;
exList(s).forEach((x,i)=>{for(let q=0;q<x.sets;q++){t++;if(LOG[kSet(s.id,i,q)]?.done)n++}});
return{t,n,pct:t?Math.round(n/t*100):0};
}
function lastDone(sid){
for(let i=JOURNAL.length-1;i>=0;i--) if(JOURNAL[i].id===sid) return JOURNAL[i].d;
return null;
}
function daysSince(dk){
if(!dk) return null;
const [y,m,d]=dk.split('-').map(Number);
const then=new Date(y,m-1,d), now=new Date();
return Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-then)/864e5);
}
function agoLabel(dk){
const n=daysSince(dk);
if(n===null) return T(CO.never);
if(n===0) return T(CO.today);
if(n===1) return T(CO.yest);
return n+' '+T(CO.daysAgo);
}
function setAccent(){
const a=S(viewIdx).accent;
document.documentElement.style.setProperty('--accent',a[0]);
document.documentElement.style.setProperty('--accent2',a[1]);
document.documentElement.style.setProperty('--glow',a[0]+'4D');
}

rot().forEach((s,i)=>{
const isNext=i===POS, isView=i===viewIdx;
const b=el('button','rchip'+(isNext?' next':'')+(isView?' on':''));
b.innerHTML=`<u>${isNext?esc(T(CO.next)):String(i+1)}</u><b>${s.code}</b>`;
b.onclick=()=>{viewIdx=i;setAccent();if(curView!=='train')setView('train');
renderRail();renderTrain();window.scrollTo({top:0,behavior:'smooth'})};
c.appendChild(b);

}
function exCard(s,x,i,isCore,offset){
const card=el('div','ex'+(isCore?' core':''));
let n=0;for(let q=0;q<x.sets;q++)if(LOG[kSet(s.id,i,q)]?.done)n++;
if(n===x.sets)card.classList.add('done');
const prev=HIST[kEx(s.id,x)]||[];
const h=el('button','exh');
h.innerHTML=`<span class="ix">${isCore?'C'+(i-offset+1):i+1}</span>
<span class="exn"><b>${esc(T(x.n))}</b><em class="${x.tier===1?'':'t2'}">${esc(T(x.tier===1?T1:T2))}</em></span>
<span class="exs"><b>${x.sets}×${esc(x.reps.replace(/ \/ side| each/,''))}</b>
<span>${n}/${x.sets} ${esc(T(CO.sets))}</span></span>`;
h.onclick=()=>{
const was=card.classList.contains('open');
[...card.parentNode.querySelectorAll('.ex.open')].forEach(o=>o.classList.remove('open'));
if(!was){card.classList.add('open');buildBody(card,s,x,i,prev)}
};
card.appendChild(h);
card.appendChild(el('div','exb'));
card._build=()=>buildBody(card,s,x,i,prev);
return card;
}
function buildBody(card,s,x,i,prev){
const b=card.querySelector('.exb');
if(b.dataset.built)return; b.dataset.built='1';
const sh=SHOTS[x.anim];
const stage=el('div','stage');
if(sh){
const mk=MUSCLE[x.anim];
stage.innerHTML='<div class="shot"><img class="sa" loading="lazy" alt="" src="'+sh[0]+'">'+
'<img class="sb" loading="lazy" alt="" src="'+sh[1]+'">'+
'<span class="pos pa">'+esc(T(CO.posStart))+'</span><span class="pos pb">'+esc(T(CO.posEnd))+'</span></div>'+
(mk?'<span class="mus-label">'+esc(T(MUSNAME[mk]))+'</span>':'');
b.appendChild(stage);
const fk=FAULT[x.anim];
if(fk&&FAULTS[fk]){const fc=el('p','fault-cue');
fc.innerHTML='<b>'+esc(T(FAULTS[fk].t))+'</b> — '+esc(T(FAULTS[fk].c));
stage.appendChild(fc);}
}else{
stage.innerHTML=figureSVG(x.anim)+'<span class="ph"></span><button class="spd">1×</button><span class="mus-label"></span>';
b.appendChild(stage);
const fc=el('p','fault-cue');stage.appendChild(fc);
stage._exname=T(x.n);
const rec=mountAnim(stage,x.anim);
const spd=stage.querySelector('.spd');
spd.onclick=e=>{e.stopPropagation();
const o=[1,.5,1.5],nx=o[(o.indexOf(rec.speed)+1)%o.length];rec.speed=nx;spd.textContent=nx+'×'};
}
b.appendChild(el('p','cue',esc(T(x.cue))));
b.appendChild(el('p','alt','<b>'+esc(T(CO.swap))+':</b> '+esc(T(x.alt))));
const acts=el('div','acts');
const a=el('a','act',esc(T(CO.tutorial))+' ↗');a.href=yt(x.q);a.target='_blank';a.rel='noopener';
acts.appendChild(a);
const rb=el('button','act',esc(T(CO.rest))+' '+x.rest+'s');
rb.onclick=()=>startTimer(x.rest,T(x.n));acts.appendChild(rb);
b.appendChild(acts);
const sets=el('div','sets');
for(let q=0;q<x.sets;q++){
const k=kSet(s.id,i,q),rc=LOG[k]||{},p=prev[q];
const row=el('div','srow'+(rc.done?' on':''));
row.appendChild(el('span','tag',
`<b>${LANG==='en'?'SET':'م'} ${q+1}</b>`+(p&&p.w?`<small>${esc(T(CO.last))} ${esc(p.w)}×${esc(p.r||'')}</small>`:'')));
const wi=el('input');wi.type='text';wi.inputMode='decimal';
wi.placeholder=LANG==='en'?'kg':'كغ';wi.value=rc.w||(p&&p.w?p.w:'');
const ri=el('input');ri.type='text';ri.inputMode='numeric';
ri.placeholder=LANG==='en'?'reps':'تكرار';ri.value=rc.r||'';
const save=()=>{LOG[k]={...(LOG[k]||{}),w:wi.value,r:ri.value};store.set('ppl4-log',LOG)};
wi.onchange=save;ri.onchange=save;
const tick=el('button','tick','✓');
tick.onclick=()=>{
const on=!(LOG[k]?.done);
LOG[k]={...(LOG[k]||{}),w:wi.value,r:ri.value,done:on};
store.set('ppl4-log',LOG);
row.classList.toggle('on',on);
if(on){startTimer(x.rest,T(x.n));if(navigator.vibrate)navigator.vibrate(22)}
refreshCounts(s,card,x,i);
};
row.append(wi,ri,tick);sets.appendChild(row);
}
b.appendChild(sets);
if(prev.some(p=>p&&p.w)) b.appendChild(el('p','pb','↑ '+esc(T(CO.beat))));
}
function refreshCounts(s,card,x,i){
let n=0;for(let q=0;q<x.sets;q++)if(LOG[kSet(s.id,i,q)]?.done)n++;
const lbl=card.querySelector('.exs span');
if(lbl)lbl.textContent=`${n}/${x.sets} ${T(CO.sets)}`;
card.classList.toggle('done',n===x.sets);
const st=stats(s),v=$('#v-train');
const f=v.querySelector('.meter .fill'),p=v.querySelector('.meter .pct');
if(f)f.style.width=st.pct+'%';
if(p)p.textContent=st.n+'/'+st.t;
const fin=v.querySelector('.finish');
if(fin){fin.disabled=!st.n;fin.textContent=T(st.n?CO.finish:CO.saved)}
renderRail();
}

if(INSTALLED||HIDEINSTALL) return null;
const c=el('div','install',

<h4>${esc(T(CO.install))}</h4><p>${esc(T(CO.installP))}</p>
<ol><li>${esc(T(CO.i1))}</li>
<li>${esc(T(CO.i2))} <span class="shareico">↑</span></li>
<li>${esc(T(CO.i3))}</li><li>${esc(T(CO.i4))}</li></ol>`);
c.querySelector('.x').onclick=()=>{HIDEINSTALL=true;store.set('ppl4-hideinstall',true);renderTrain()};

function estMins(s){let n=0;exList(s).forEach(x=>n+=x.sets);return Math.round((n*1.9+8)/5)*5}
function lastTrainedLabel(){
if(!JOURNAL.length) return null;
return agoLabel(JOURNAL[JOURNAL.length-1].d);
}
function heroCard(s){
const h=el('div','hero');
const nEx=s.ex.length, mins=estMins(s);
const ago=agoLabel(lastDone(s.id));
h.innerHTML=`<div class="lab"><i></i>${esc(T(CO.upNextBig))}</div>
<h1>${esc(T(s.title))}</h1>
<p class="meta">${esc(T(s.focus))} &middot; ${nEx} ${esc(T(CO.exCount))} + ${esc(T(CO.plusAbs))} &middot; ~${mins} ${esc(T(CO.mins))}</p>
<p class="ago">${esc(T(CO.lastDone))}: ${esc(ago)}</p>
<button class="go">${esc(T(CO.start))} &rarr;</button>
<div class="dots">${rot().map((z,i)=>`<i class="${i===POS?'on':''}"></i>`).join('')}</div>`;
h.querySelector('.go').onclick=()=>{
const first=$('#v-train').querySelector('.ex');

if(!first.classList.contains('open')){

function calmLine(){
const since=JOURNAL.length?daysSince(JOURNAL[JOURNAL.length-1].d):null;
let txt;
if(since===null) txt=T(CO.calmNever);
else if(since===0) txt=T(CO.calmToday);
else txt=T(CO.calmGap).replace('%s',esc(lastTrainedLabel()));
return el('div','calm','<span class="ic">&#9211;</span><span>'+txt+'</span>');
}
function renderTrain(){
const s=S(viewIdx),v=$('#v-train');
const openIdx=[...v.querySelectorAll('.ex')].findIndex(e=>e.classList.contains('open'));
v.innerHTML='';
if(viewIdx!==POS){
const u=el('div','upnext',
`<span class="dot"></span><span class="tx">${esc(T(CO.upNext))}<b>${esc(T(S(POS).title))}</b></span>
<button class="jump">${esc(T(CO.jump))} →</button>`);
u.querySelector('.jump').onclick=()=>{viewIdx=POS;setAccent();renderRail();renderTrain();window.scrollTo({top:0,behavior:'smooth'})};
v.appendChild(u);
}
v.appendChild(heroCard(s));

const ic=installCard(); if(ic) v.appendChild(ic);
v.appendChild(el('p','sub',esc(T(s.sub))));

v.appendChild(el('div','meter',
`<div class="bar"><div class="fill" style="width:${st.pct}%"></div></div><div class="pct tnum">${st.n}/${st.t}</div>`));
const cards=[],off=s.ex.length;
s.ex.forEach((k,i)=>{const c=exCard(s,E[k],i,false,off);v.appendChild(c);cards.push(c)});
v.appendChild(el('h3','sec dsp',esc(T(CO.core))));
s.core.forEach((k,i)=>{const c=exCard(s,E[k],off+i,true,off);v.appendChild(c);cards.push(c)});
v.appendChild(el('div','note ok','<p>'+esc(T(s.cardio))+'</p>'));
const fin=el('button','finish',esc(T(st.n?CO.finish:CO.saved)));
fin.disabled=!st.n;
fin.onclick=()=>finishSession(s);
v.appendChild(fin);
v.appendChild(el('p','sub',esc(T(CO.notThis))));
let tgt=openIdx;
if(tgt<0) tgt=cards.findIndex(c=>!c.classList.contains('done'));
if(tgt>=0&&cards[tgt]){cards[tgt].classList.add('open');cards[tgt]._build()}
}
function finishSession(s){
exList(s).forEach((x,i)=>{
const arr=[];
for(let q=0;q<x.sets;q++){const r=LOG[kSet(s.id,i,q)];arr.push({w:r?.w||'',r:r?.r||''});delete LOG[kSet(s.id,i,q)]}
if(arr.some(z=>z.w))HIST[kEx(s.id,x)]=arr;
});
JOURNAL.push({id:s.id,code:s.code,d:dayKey()});
if(JOURNAL.length>300)JOURNAL=JOURNAL.slice(-300);
POS=(rot().findIndex(z=>z.id===s.id)+1)%ROTLEN;
viewIdx=POS;
store.set('ppl4-log',LOG);store.set('ppl4-hist',HIST);
store.set('ppl4-journal',JOURNAL);store.set('ppl4-pos',POS);
setAccent();renderRail();renderTrain();renderYou();
window.scrollTo({top:0,behavior:'smooth'});
if(navigator.vibrate)navigator.vibrate([25,60,25]);
}
let tId=null,tLeft=0,tTotal=0;
function startTimer(sec,who){
tLeft=sec;tTotal=sec;
$('#tWho').textContent=who;$('#tSub').textContent=T(CO.restSub);
$('#timer').classList.add('on');paint();clearInterval(tId);
tId=setInterval(()=>{tLeft--;paint();
if(tLeft<=0){clearInterval(tId);$('#timer').classList.remove('on');
if(navigator.vibrate)navigator.vibrate([180,90,180])}},1000);
}
function paint(){
$('#tVal').textContent=Math.floor(tLeft/60)+':'+String(Math.max(tLeft%60,0)).padStart(2,'0');
$('#tArc').setAttribute('stroke-dashoffset',138.2*(1-Math.max(tLeft,0)/tTotal));
}
$('#tAdd').onclick=()=>{tLeft+=30;tTotal=Math.max(tTotal,tLeft);paint()};
$('#tSkip').onclick=()=>{clearInterval(tId);$('#timer').classList.remove('on')};

you:'<path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21c0-4 3.6-6 8-6s8 2 8 6"/>'};
function renderNav(){
const n=$('#nav');n.innerHTML='';
[['train',CO.navTrain],['core',CO.navCore],['food',CO.navFood],['plan',CO.navPlan],['you',CO.navYou]]
.forEach(([k,l])=>{
const b=el('button',curView===k?'on':'');
b.innerHTML=`<svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${esc(T(l))}</span>`;
b.onclick=()=>setView(k);n.appendChild(b)});
}
function setView(k){
curView=k;document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
$('#v-'+k).classList.add('on');renderNav();window.scrollTo({top:0});
$('.railwrap').style.display=(k==='train')?'block':'none';
}
function renderAll(){
document.body.dir=LANG==='ar'?'rtl':'ltr';document.documentElement.lang=LANG;
$('#langBtn').textContent=LANG==='en'?'عربي':'EN';
setAccent();renderRail();renderTrain();renderCore();renderFood();renderPlan();renderYou();renderNav();
}
$('#langBtn').onclick=()=>{LANG=LANG==='en'?'ar':'en';store.set('ppl4-lang',LANG);renderAll()};
(function(){
try{INSTALLED=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}catch(e){}
LOG=store.get('ppl4-log')||{};
HIST=store.get('ppl4-hist')||{};
JOURNAL=store.get('ppl4-journal')||[];
POS=store.get('ppl4-pos')??0;
ROTLEN=store.get('ppl5-rotlen')??5;
HIDEINSTALL=store.get('ppl4-hideinstall')||false;
if(!store.get('ppl5-migrated')){
const prevH=store.get('ppl4-hist')||store.get('ppl3-hist')||store.get('ppl2-hist')||{};
const OLD={pushA:['machineChest','inclineDB','cableFly','cableLat','ohTri','cableCrunch'],
pullA:['pulldown','chestRow','pullover','rearPec','inclineCurl','kneeRaise'],
legsA:['legPress','legExt','seatedCurl','calf','latBonus','pallof'],
legs:['legPress','legExt','seatedCurl','calf','latBonus','pallof'],
pushB:['dbShoulder','dbLat','inclineMachine','pecDeck','pushdown','declineSit','chop'],
pullB:['seatedRow','neutralPulldown','rearCable','shrug','cableCurl','abWheel'],
legsB:['rdl','hackSquat','lyingCurl','seatedCalfR','latBonus','cableCrunch']};
const m={};
for(const k in prevH){
const p=k.split('|'); if(p.length!==2) continue;
const sid=p[0]==='legs'?'legsA':p[0], idx=parseInt(p[1],10);
const list=OLD[p[0]]; if(!list) continue;
const exKey=list[idx]; if(!exKey||!E[exKey]) continue;
m[sid+'|'+E[exKey].n.en]=prevH[k];
}
for(const k in HIST){if(/\|\d+$/.test(k))delete HIST[k]}
HIST=Object.assign(m,HIST);
store.set('ppl4-hist',HIST);store.set('ppl5-migrated',true);
}
const l=store.get('ppl4-lang')||store.get('ppl3-lang');if(l==='ar'||l==='en')LANG=l;
if(POS>=ROTLEN)POS=0;
viewIdx=POS;
renderAll();
})();</script>
